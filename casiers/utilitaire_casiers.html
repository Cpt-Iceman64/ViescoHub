<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casiers - ViescoHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080c16;
            color: #f8fafc;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center top;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .glow-text { position: relative; }
        .glow-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 10px;
            background: #2563eb;
            filter: blur(20px);
            opacity: 0.5;
            z-index: -1;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        input[type="text"], input[type="number"] {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        input:focus {
            border-color: #3b82f6;
            outline: none;
        }

        .tab-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .glass-panel { background: white !important; border: none !important; box-shadow: none !important; color: black !important;}
            h2, h3 { color: black !important; }
            .page-break { page-break-before: always; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
            input { border: none !important; background: transparent !important; color: black !important; width: 100%; }
        }
    </style>
</head>
<body class="overflow-x-hidden">
    <!-- Lueur bleue -->
    <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[500px] bg-blue-900/20 rounded-full blur-[120px] pointer-events-none -z-10"></div>

    <header class="w-full no-print z-30 bg-[#05080f]/90 backdrop-blur-sm border-b border-slate-800/50 sticky top-0">
        <div class="w-full px-4 md:px-12 py-4 md:py-5 flex justify-between items-center relative">
            <div class="flex items-center gap-3">
                <div class="text-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><path d="M14 8h.01"/><path d="M14 16h.01"/></svg>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">Viesco<span class="text-blue-500">Hub</span></span>
            </div>

            <!-- Bouton Hamburger -->
            <button id="mobile-menu-btn" class="lg:hidden text-slate-400 hover:text-white transition-colors p-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>

            <nav class="hidden lg:flex items-center gap-4 xl:gap-6 text-[10px] xl:text-xs font-bold tracking-widest uppercase text-slate-400">
                <a href="../index.html" class="hover:text-blue-400 transition-colors">Accueil</a>
                <a href="../pages/absences.html" class="hover:text-blue-400 transition-colors">Absences</a>
                <a href="../pages/bilan-absences.html" class="hover:text-blue-400 transition-colors">Bilan Abs.</a>
                <a href="../pages/programme-retenues.html" class="hover:text-blue-400 transition-colors">Retenues</a>
                <a href="../pages/bilan-sanctions.html" class="hover:text-blue-400 transition-colors">Bilan Sanc.</a>
                <a href="../pages/createur-devoirs.html" class="hover:text-blue-400 transition-colors">Devoirs</a>
                <a href="../pages/documents.html" class="hover:text-blue-400 transition-colors">Documents</a>
                <a href="../pages/planning.html" class="hover:text-blue-400 transition-colors">Planning</a>
                <span class="text-slate-600 hidden xl:inline">|</span>
                <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full">
                    <div class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></div>
                    <span id="live-time" class="text-sm font-bold text-blue-400 font-mono">--:--</span>
                </div>
            </nav>
        </div>

        <!-- Menu Mobile -->
        <div id="mobile-menu" class="hidden lg:hidden border-t border-slate-800/50 bg-[#05080f] w-full px-6 py-4">
            <nav class="flex flex-col gap-4 text-sm font-bold tracking-wider uppercase text-slate-400">
                <a href="../index.html" class="hover:text-blue-400">Accueil</a>
                <a href="../pages/absences.html" class="hover:text-blue-400">Absences</a>
                <a href="../pages/bilan-absences.html" class="hover:text-blue-400">Bilan Absences</a>
                <a href="../pages/programme-retenues.html" class="hover:text-blue-400">Retenues</a>
                <a href="../pages/bilan-sanctions.html" class="hover:text-blue-400">Bilan Sanctions</a>
                <a href="../pages/createur-devoirs.html" class="hover:text-blue-400">Créateur Devoirs</a>
                <a href="../pages/documents.html" class="hover:text-blue-400">Documents</a>
                <a href="../pages/planning.html" class="hover:text-blue-400">Planning</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto px-4 sm:px-6 py-8 md:py-10">
        <div class="text-center mb-10 no-print">
            <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight mb-4">
                Gestion des <span class="text-white glow-text">Casiers</span>
            </h1>
            <p class="text-slate-400 font-medium text-sm md:text-base mb-2" id="sync-status">
                🟠 Connexion Firebase en cours...
            </p>
        </div>

        <div class="flex flex-wrap gap-4 mb-8 no-print justify-center border-b border-slate-800 pb-4">
            <button class="tab-btn active px-6 py-2.5 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 border border-slate-700 transition-colors" onclick="switchTab('config')">⚙️ Configuration</button>
            <button class="tab-btn px-6 py-2.5 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 border border-slate-700 transition-colors" onclick="switchTab('saisie')">📝 Saisie & Impression</button>
        </div>

        <!-- ONGLET CONFIGURATION -->
        <div id="tab-config" class="tab-content active glass-panel rounded-xl p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 no-print">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Total casiers</label>
                    <input type="number" id="total-casiers" value="200" class="w-full px-4 py-2 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Marge (casiers vides/classe)</label>
                    <input type="number" id="marge-casiers" value="3" class="w-full px-4 py-2 rounded-lg">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 no-print" id="niveaux-container"></div>
            
            <button onclick="genererCasiers()" class="w-full mt-8 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-colors no-print">
                🚀 Générer / Mettre à jour la base
            </button>
        </div>

        <!-- ONGLET SAISIE -->
        <div id="tab-saisie" class="tab-content glass-panel rounded-xl p-6">
            <div class="flex flex-col md:flex-row gap-4 mb-6 no-print">
                <input type="text" id="search-input" onkeyup="filtrerBase()" placeholder="🔍 Rechercher un nom ou numéro..." class="flex-1 px-4 py-3 rounded-lg text-lg">
                <button onclick="window.print()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                    🖨️ Imprimer les listes
                </button>
            </div>

            <div id="stats" class="text-blue-400 font-bold mb-6 text-center text-lg no-print"></div>

            <div id="tables-container" class="w-full">
                <!-- Les tables seront injectées ici pour affichage/impression -->
            </div>
        </div>
    </main>

    <script>
        const effectifsDefaut = {
            "6e1": 27, "6e2": 27, "6e3": 27,
            "5e1": 28, "5e2": 27, "5e3": 27,
            "4e1": 29, "4e2": 30, "4e3": 29,
            "3e1": 24, "3e2": 25, "3e3": 24
        };

        const niveaux = ["6e", "5e", "4e", "3e"];
        let baseCasiers = [];

        // UI Initialization
        const container = document.getElementById('niveaux-container');
        niveaux.forEach(niveau => {
            const card = document.createElement('div');
            card.className = 'bg-slate-800/50 p-4 rounded-lg border border-slate-700';
            let classesHTML = '';
            for(let i = 1; i <= 3; i++) {
                const nom = `${niveau}${i}`;
                const eff = effectifsDefaut[nom] || 27;
                classesHTML += `
                    <div class="flex gap-2 mb-3 classe-row">
                        <input type="text" value="${nom}" class="nom-classe w-2/3 px-3 py-2 rounded">
                        <input type="number" value="${eff}" class="effectif-classe w-1/3 px-3 py-2 rounded text-center font-bold" min="0">
                    </div>
                `;
            }
            card.innerHTML = `<h3 class="text-blue-400 font-bold mb-4 border-b border-slate-700 pb-2">Niveau ${niveau}</h3>
                              <div id="classes-${niveau}">${classesHTML}</div>
                              <button class="text-xs text-slate-400 hover:text-white mt-2 w-full text-left" onclick="ajouterClasse('${niveau}')">+ Ajouter classe</button>`;
            container.appendChild(card);
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            if (tabName === 'config') {
                document.getElementById('tab-config').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('tab-saisie').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                afficherBaseDonnees();
            }
        }

        function ajouterClasse(niveau) {
            const div = document.getElementById(`classes-${niveau}`);
            const count = div.children.length + 1;
            const row = document.createElement('div');
            row.className = 'flex gap-2 mb-3 classe-row';
            row.innerHTML = `<input type="text" value="${niveau}${count}" class="nom-classe w-2/3 px-3 py-2 rounded"><input type="number" value="27" class="effectif-classe w-1/3 px-3 py-2 rounded text-center font-bold" min="0">`;
            div.appendChild(row);
        }

        function genererCasiers() {
            const maxCasiers = parseInt(document.getElementById('total-casiers').value);
            const margeParClasse = parseInt(document.getElementById('marge-casiers').value);
            
            let numCasier = 1;
            let totalEleves = 0;
            let classIndex = 0; 
            let nouvelleBase = [];
            
            const rows = document.querySelectorAll('.classe-row');
            
            for (let row of rows) {
                const nomClasse = row.querySelector('.nom-classe').value;
                const effectif = parseInt(row.querySelector('.effectif-classe').value);
                
                if (effectif > 0) {
                    totalEleves += effectif;
                    for (let i = 1; i <= effectif; i += 2) {
                        if (numCasier > maxCasiers) { alert(`⚠️ Limite atteinte (${maxCasiers}).`); return; }
                        const estSolo = (i + 1 > effectif);
                        const oldData = baseCasiers.find(c => c.numero === numCasier);
                        const nom1 = oldData ? oldData.eleve1 : "";
                        const nom2 = estSolo ? "X (Casier solo)" : (oldData ? oldData.eleve2 : "");
                        nouvelleBase.push({ numero: numCasier, classe: nomClasse, eleve1: nom1, eleve2: nom2, estSolo: estSolo, estMarge: false });
                        numCasier++;
                    }
                    for (let j = 0; j < margeParClasse; j++) {
                        if (numCasier > maxCasiers) break;
                        const oldData = baseCasiers.find(c => c.numero === numCasier);
                        const nom1 = oldData ? oldData.eleve1 : "";
                        const nom2 = oldData ? oldData.eleve2 : "";
                        nouvelleBase.push({ numero: numCasier, classe: nomClasse, eleve1: nom1, eleve2: nom2, estSolo: false, estMarge: true });
                        numCasier++;
                    }
                    classIndex++;
                }
            }

            baseCasiers = nouvelleBase;
            sauvegarderBase();
            switchTab('saisie');
            document.getElementById('stats').innerText = `📊 Bilan : ${totalEleves} élèves. ${numCasier - 1} casiers alloués.`;
        }

        function afficherBaseDonnees() {
            const filtre = document.getElementById('search-input').value.toLowerCase();
            const tablesContainer = document.getElementById('tables-container');
            tablesContainer.innerHTML = '';

            if (baseCasiers.length === 0) {
                tablesContainer.innerHTML = `<p class="text-center text-slate-500 py-10">Aucune donnée. Générez la structure.</p>`;
                return;
            }

            // Grouper par classe pour l'affichage/impression
            const classesGroup = {};
            baseCasiers.forEach(casier => {
                if (!classesGroup[casier.classe]) classesGroup[casier.classe] = [];
                if (filtre === "" || casier.numero.toString().includes(filtre) || casier.eleve1.toLowerCase().includes(filtre) || casier.eleve2.toLowerCase().includes(filtre) || casier.classe.toLowerCase().includes(filtre)) {
                    classesGroup[casier.classe].push(casier);
                }
            });

            let classIndex = 0;
            for (const [nomClasse, casiers] of Object.entries(classesGroup)) {
                if(casiers.length === 0) continue;
                
                let classHTML = `
                <div class="mb-10 ${classIndex > 0 ? 'page-break' : ''}">
                    <div class="flex justify-between items-center mb-4 border-b border-blue-900/50 pb-2">
                        <h2 class="text-xl font-bold text-blue-400">Attribution - Classe : ${nomClasse}</h2>
                        <button id="btn-save-${nomClasse}" onclick="sauvegarderClasse('${nomClasse}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-1.5 px-4 rounded-lg transition-colors no-print">
                            ✅ Sauvegarder la classe
                        </button>
                    </div>
                    <table class="w-full text-left text-sm bg-slate-800/20 rounded-lg overflow-hidden border border-slate-700/50">
                        <thead class="bg-slate-800 text-slate-300">
                            <tr>
                                <th class="p-3 w-16 text-center">N°</th>
                                <th class="p-3 w-32">Type</th>
                                <th class="p-3">Nom Prénom 1</th>
                                <th class="p-3">Nom Prénom 2</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50">`;
                
                casiers.forEach(casier => {
                    let typeTxt = casier.estMarge ? '<span class="text-orange-400 text-xs font-bold px-2 py-1 bg-orange-400/10 rounded">Marge</span>' : 'Standard';
                    let input1 = `<input type="text" id="eleve1-${casier.numero}" value="${casier.eleve1}" oninput="marquerModifie(${casier.numero}, '${nomClasse}')" placeholder="..." class="bg-transparent border-b border-slate-600 focus:border-blue-400 px-2 py-1 w-full text-white">`;
                    let input2 = casier.estSolo ? `<span class="text-slate-500 italic text-xs">Casier solo</span>` : `<input type="text" id="eleve2-${casier.numero}" value="${casier.eleve2}" oninput="marquerModifie(${casier.numero}, '${nomClasse}')" placeholder="..." class="bg-transparent border-b border-slate-600 focus:border-blue-400 px-2 py-1 w-full text-white">`;
                    
                    classHTML += `
                        <tr class="hover:bg-slate-800/30 transition-colors">
                            <td class="p-3 text-center font-bold text-blue-300">${casier.numero}</td>
                            <td class="p-3">${typeTxt}</td>
                            <td class="p-3">${input1}</td>
                            <td class="p-3">${input2}</td>
                        </tr>`;
                });
                classHTML += `</tbody></table></div>`;
                tablesContainer.innerHTML += classHTML;
                classIndex++;
            }
        }

        function filtrerBase() {
            afficherBaseDonnees();
        }

        function marquerModifie(numCasier, nomClasse) {
            let input1 = document.getElementById(`eleve1-${numCasier}`);
            let input2 = document.getElementById(`eleve2-${numCasier}`);
            if(input1 && document.activeElement === input1) input1.dataset.modified = "true";
            if(input2 && document.activeElement === input2) input2.dataset.modified = "true";

            const btn = document.getElementById(`btn-save-${nomClasse}`);
            if (btn) {
                btn.classList.add('animate-pulse', 'bg-amber-600');
                btn.classList.remove('bg-emerald-600');
                btn.innerText = '⚠️ Sauvegarder la classe';
            }
        }

        function sauvegarderClasse(nomClasse) {
            let casiersClasse = baseCasiers.filter(c => c.classe === nomClasse);
            
            const btn = document.getElementById(`btn-save-${nomClasse}`);
            if (btn) {
                btn.innerText = '⏳ Enregistrement...';
                btn.classList.remove('animate-pulse', 'bg-amber-600');
                btn.classList.add('bg-emerald-600');
            }

            const db = firebase.firestore();
            const docRef = db.collection('viescohub_data').doc('casiers');

            db.runTransaction((transaction) => {
                return transaction.get(docRef).then((doc) => {
                    if (!doc.exists) throw "Le document casiers n'existe pas.";
                    
                    let dbCasiers = doc.data().data;
                    
                    casiersClasse.forEach(localC => {
                        let dbCasier = dbCasiers.find(c => c.numero === localC.numero);
                        if (dbCasier) {
                            let input1 = document.getElementById(`eleve1-${localC.numero}`);
                            let input2 = document.getElementById(`eleve2-${localC.numero}`);
                            if(input1) dbCasier.eleve1 = input1.value;
                            if(input2) dbCasier.eleve2 = input2.value;
                        }
                    });
                    
                    transaction.update(docRef, { data: dbCasiers });
                });
            }).then(() => {
                casiersClasse.forEach(localC => {
                    let input1 = document.getElementById(`eleve1-${localC.numero}`);
                    let input2 = document.getElementById(`eleve2-${localC.numero}`);
                    if (input1) input1.dataset.modified = "false";
                    if (input2) input2.dataset.modified = "false";
                });
                if (btn) {
                    btn.innerText = '✅ Sauvegardé';
                    setTimeout(() => {
                        if (btn.innerText === '✅ Sauvegardé') {
                            btn.innerText = '✅ Sauvegarder la classe';
                        }
                    }, 2500);
                }
            }).catch((error) => {
                console.error("Erreur de synchronisation:", error);
                if (btn) {
                    btn.innerText = '❌ Erreur (Réessayer)';
                    btn.classList.add('bg-red-600');
                    btn.classList.remove('bg-emerald-600');
                }
            });
        }

        // --- FIREBASE SYNC --- //
        function sauvegarderBase() {
            if (window.fbSet) {
                window.fbSet('viescohub_data', 'casiers', { data: baseCasiers });
            }
        }

        setTimeout(() => {
            if (window.fbListen) {
                window.fbListen('viescohub_data', 'casiers', (docData) => {
                    document.getElementById('sync-status').innerHTML = "🟢 Connecté et synchronisé en temps réel";
                    document.getElementById('sync-status').className = "text-emerald-400 font-bold text-sm md:text-base mb-2";
                    if (docData && docData.data) {
                        baseCasiers = docData.data;
                        if(document.getElementById('tab-saisie').classList.contains('active')) {
                            const tablesContainer = document.getElementById('tables-container');
                            // S'il n'y a pas encore d'inputs générés, on affiche tout
                            if (tablesContainer.querySelectorAll('input').length === 0) {
                                afficherBaseDonnees();
                            } else {
                                // Mettre à jour intelligemment pour ne pas perdre le focus
                                baseCasiers.forEach(casier => {
                                    const input1 = document.getElementById(`eleve1-${casier.numero}`);
                                    const input2 = document.getElementById(`eleve2-${casier.numero}`);
                                    
                                    if (input1 && input1.dataset.modified !== "true" && document.activeElement !== input1 && input1.value !== casier.eleve1) {
                                        input1.value = casier.eleve1;
                                    }
                                    if (input2 && input2.dataset.modified !== "true" && document.activeElement !== input2 && input2.value !== casier.eleve2) {
                                        input2.value = casier.eleve2;
                                    }
                                });
                            }
                        }
                    }
                }, (error) => {
                    console.error(error);
                    document.getElementById('sync-status').innerHTML = "🔴 Erreur Firebase: " + error.message;
                    document.getElementById('sync-status').className = "text-red-400 font-bold text-sm md:text-base mb-2";
                });
            } else {
                document.getElementById('sync-status').innerHTML = "🔴 Erreur : Firebase non chargé";
                document.getElementById('sync-status').className = "text-red-400 font-bold text-sm md:text-base mb-2";
            }
        }, 1500);

        // --- HORLOGE TEMPS RÉEL --- //
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
            const clockEl = document.getElementById('live-time');
            if (clockEl) clockEl.textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1) + ' • ' + timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

    </script>
    <script src="../js/menu.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Casiers - Cordeliers</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #2980b9; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #bdc3c7; }
        .tab-btn { padding: 10px 20px; background: #ecf0f1; border: none; cursor: pointer; font-size: 1em; font-weight: bold; color: #7f8c8d; border-radius: 5px 5px 0 0; margin-right: 5px; }
        .tab-btn.active { background: var(--secondary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .config-header { display: flex; gap: 20px; margin-bottom: 20px; background: #ecf0f1; padding: 15px; border-radius: 8px; }
        .config-header div { flex: 1; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9em; }
        input[type="number"], input[type="text"] { width: 100%; padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .niveau-card { background: #fff; border: 2px solid #ecf0f1; border-radius: 8px; padding: 15px; }
        .niveau-card h3 { margin-top: 0; color: var(--secondary); border-bottom: 2px solid var(--secondary); padding-bottom: 5px; }
        .classe-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .nom-classe { flex: 2; }
        .effectif-classe { flex: 1; min-width: 65px; }
        
        .btn { background-color: var(--secondary); color: white; border: none; padding: 12px 20px; font-size: 1em; border-radius: 5px; cursor: pointer; transition: background 0.3s; width: 100%; margin-top: 20px; font-weight: bold; }
        .btn:hover { background-color: #3498db; }
        .btn-add { background-color: #27ae60; padding: 5px 10px; font-size: 0.8em; margin-top: 10px; }
        .btn-add:hover { background-color: #2ecc71; }
        .btn-print { background-color: #7f8c8d; }
        .btn-print:hover { background-color: #95a5a6; }
        
        /* Barres et outils base de données */
        .db-tools { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; background: #ecf0f1; padding: 15px; border-radius: 8px;}
        .search-bar { flex: 2; padding: 12px; font-size: 1.1em; border: 2px solid var(--secondary); border-radius: 5px; margin: 0; }
        .btn-link { flex: 1; background-color: #e67e22; margin-top: 0; padding: 10px; }
        .btn-link:hover { background-color: #d35400; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; height: 25px; }
        th { background-color: var(--primary); color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .input-eleve { border: none; background: transparent; width: 100%; font-size: 1em; outline: none; }
        .input-eleve:focus { border-bottom: 2px solid var(--secondary); }

        #stats { margin-top: 20px; font-weight: bold; color: #d35400; background: #fdf3e7; padding: 10px; border-radius: 5px;}
        .classe-section { margin-bottom: 40px; }
        .classe-title { color: var(--primary); border-bottom: 2px solid var(--secondary); padding-bottom: 10px; margin-top: 30px; }
        #status-link { font-weight: bold; color: #e74c3c; margin-top: 10px; text-align: center; }

        @media print {
            .no-print, .tabs, #tab-saisie { display: none !important; }
            #tab-config { display: block !important; }
            .container { box-shadow: none; padding: 0; }
            body { background: white; margin: 0; }
            .page-break { page-break-before: always; }
            table { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="no-print">🏫 Tableau de Bord - Affectation des Casiers</h1>
    
    <div class="tabs no-print">
        <button class="tab-btn active" onclick="switchTab('config')">⚙️ 1. Paramétrage & Impression</button>
        <button class="tab-btn" onclick="switchTab('saisie')">🗂️ 2. Saisie & Synchro JSON</button>
    </div>

    <!-- ONGLET 1 -->
    <div id="tab-config" class="tab-content active">
        <div class="no-print">
            <div class="config-header">
                <div>
                    <label for="total-casiers">Nombre total de casiers du collège</label>
                    <input type="number" id="total-casiers" value="200" min="1">
                </div>
                <div>
                    <label for="marge-casiers">Casiers vides par classe (marge)</label>
                    <input type="number" id="marge-casiers" value="3" min="0">
                </div>
            </div>

            <div class="grid" id="niveaux-container"></div>
            <button class="btn" onclick="genererCasiers()">🚀 Générer la structure</button>
        </div>

        <div id="result-section" style="display:none;">
            <div class="no-print" style="display: flex; gap: 15px; align-items: center; justify-content: space-between; margin-top: 30px;">
                <h2 style="color: var(--primary);">Aperçu Impression</h2>
                <button class="btn btn-print" style="width: auto; margin: 0;" onclick="window.print()">🖨️ Imprimer les listes (1 par classe)</button>
            </div>
            <div id="stats" class="no-print"></div>
            <div id="tables-container"></div>
        </div>
    </div>

    <!-- ONGLET 2 -->
    <div id="tab-saisie" class="tab-content">
        
        <div class="db-tools">
            <input type="text" id="search-input" class="search-bar" placeholder="🔍 Rechercher un nom ou un numéro..." onkeyup="filtrerBase()">
            <button class="btn btn-link" onclick="lierFichier()">🔗 Lier le fichier casiers.json (Auto-Save)</button>
        </div>
        <div id="status-link">❌ Aucun fichier lié. Mode sauvegarde temporaire (LocalStorage).</div>
        
        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">Casier</th>
                    <th style="width: 15%;">Classe</th>
                    <th style="width: 37.5%;">Nom Prénom 1</th>
                    <th style="width: 37.5%;">Nom Prénom 2</th>
                </tr>
            </thead>
            <tbody id="db-table-body">
                <tr><td colspan="4" style="text-align: center;">Générez la structure d'abord, ou liez un fichier JSON.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const effectifsDefaut = {
        "6e1": 27, "6e2": 27, "6e3": 27,
        "5e1": 28, "5e2": 27, "5e3": 27,
        "4e1": 29, "4e2": 30, "4e3": 29,
        "3e1": 24, "3e2": 25, "3e3": 24
    };

    const niveaux = ["6e", "5e", "4e", "3e"];
    
    let baseCasiers = JSON.parse(localStorage.getItem('baseCasiers')) || [];
    let fileHandle = null; // Variable clé pour la synchronisation du fichier source

    const container = document.getElementById('niveaux-container');
    niveaux.forEach(niveau => {
        const card = document.createElement('div');
        card.className = 'niveau-card';
        let classesHTML = '';
        for(let i = 1; i <= 3; i++) {
            const nom = `${niveau}${i}`;
            const eff = effectifsDefaut[nom] || 27;
            classesHTML += `
                <div class="classe-row">
                    <input type="text" value="${nom}" class="nom-classe" placeholder="Nom">
                    <input type="number" value="${eff}" class="effectif-classe" placeholder="Effectif" min="0">
                </div>
            `;
        }
        card.innerHTML = `<h3>Niveau ${niveau}</h3><div id="classes-${niveau}">${classesHTML}</div><button class="btn btn-add no-print" onclick="ajouterClasse('${niveau}')">+ Ajouter une classe</button>`;
        container.appendChild(card);
    });

    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        if (tabName === 'config') {
            document.getElementById('tab-config').classList.add('active');
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
        } else {
            document.getElementById('tab-saisie').classList.add('active');
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            afficherBaseDonnees();
        }
    }

    function ajouterClasse(niveau) {
        const div = document.getElementById(`classes-${niveau}`);
        const count = div.children.length + 1;
        const row = document.createElement('div');
        row.className = 'classe-row';
        row.innerHTML = `<input type="text" value="${niveau}${count}" class="nom-classe"><input type="number" value="27" class="effectif-classe" min="0">`;
        div.appendChild(row);
    }

    function genererCasiers() {
        const maxCasiers = parseInt(document.getElementById('total-casiers').value);
        const margeParClasse = parseInt(document.getElementById('marge-casiers').value);
        const tablesContainer = document.getElementById('tables-container');
        tablesContainer.innerHTML = '';
        
        let numCasier = 1;
        let totalEleves = 0;
        let classIndex = 0; 
        let nouvelleBase = [];
        
        const rows = document.querySelectorAll('.classe-row');
        
        for (let row of rows) {
            const nomClasse = row.querySelector('.nom-classe').value;
            const effectif = parseInt(row.querySelector('.effectif-classe').value);
            
            if (effectif > 0) {
                totalEleves += effectif;
                let classHTML = `<div class="classe-section ${classIndex > 0 ? 'page-break' : ''}"><h2 class="classe-title">Attribution des casiers - Classe : ${nomClasse}</h2><table><thead><tr><th style="width: 15%;">N°</th><th style="width: 42.5%;">Nom Prénom 1</th><th style="width: 42.5%;">Nom Prénom 2</th></tr></thead><tbody>`;
                
                for (let i = 1; i <= effectif; i += 2) {
                    if (numCasier > maxCasiers) { alert(`⚠️ Limite atteinte (${maxCasiers}).`); return; }
                    const estSolo = (i + 1 > effectif);
                    const oldData = baseCasiers.find(c => c.numero === numCasier);
                    const nom1 = oldData ? oldData.eleve1 : "";
                    const nom2 = estSolo ? "X (Casier solo)" : (oldData ? oldData.eleve2 : "");

                    nouvelleBase.push({ numero: numCasier, classe: nomClasse, eleve1: nom1, eleve2: nom2, estSolo: estSolo, estMarge: false });
                    classHTML += `<tr><td style="text-align: center;"><strong>${numCasier}</strong></td><td>${nom1}</td><td>${nom2}</td></tr>`;
                    numCasier++;
                }

                for (let j = 0; j < margeParClasse; j++) {
                    if (numCasier > maxCasiers) break;
                    const oldData = baseCasiers.find(c => c.numero === numCasier);
                    const nom1 = oldData ? oldData.eleve1 : "";
                    const nom2 = oldData ? oldData.eleve2 : "";
                    
                    nouvelleBase.push({ numero: numCasier, classe: nomClasse, eleve1: nom1, eleve2: nom2, estSolo: false, estMarge: true });
                    classHTML += `<tr><td style="text-align: center;"><strong>${numCasier}</strong></td><td>${nom1}</td><td>${nom2}</td></tr>`;
                    numCasier++;
                }
                classHTML += `</tbody></table></div>`;
                tablesContainer.innerHTML += classHTML;
                classIndex++;
            }
        }

        baseCasiers = nouvelleBase;
        sauvegarderBase();
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('stats').innerText = `📊 Bilan : ${totalEleves} élèves. ${numCasier - 1} casiers alloués.`;
    }

    // --- LA MAGIE DE L'ÉCRITURE LOCALE --- //
    
    async function lierFichier() {
        try {
            // Ouvre la boîte de dialogue pour que tu sélectionnes "casiers.json"
            [fileHandle] = await window.showOpenFilePicker({
                types: [{
                    description: 'Fichier JSON',
                    accept: {'application/json': ['.json']}
                }],
            });
            
            // Lit le contenu du fichier sélectionné
            const file = await fileHandle.getFile();
            const contents = await file.text();
            
            if (contents.trim() !== "") {
                baseCasiers = JSON.parse(contents);
                afficherBaseDonnees();
                genererCasiers(); // Actualise l'aperçu impression
            }
            
            document.getElementById('status-link').innerHTML = "✅ Fichier lié avec succès ! Les modifications sont enregistrées en direct.";
            document.getElementById('status-link').style.color = "#27ae60";
            
        } catch (error) {
            console.error("Liaison annulée ou échouée:", error);
        }
    }

    async function sauvegarderBase() {
        // Sauvegarde de secours dans le navigateur
        localStorage.setItem('baseCasiers', JSON.stringify(baseCasiers));
        
        // Si le pont est établi, on écrit silencieusement dans le fichier
        if (fileHandle) {
            try {
                const writable = await fileHandle.createWritable();
                await writable.write(JSON.stringify(baseCasiers, null, 2));
                await writable.close();
            } catch (error) {
                console.error("Erreur lors de l'enregistrement dans le fichier:", error);
                document.getElementById('status-link').innerHTML = "⚠️ Erreur de sauvegarde ! Le fichier a peut-être été déplacé.";
                document.getElementById('status-link').style.color = "#e74c3c";
            }
        }
    }

    function updateEleve(numCasier, champ, valeur) {
        let casier = baseCasiers.find(c => c.numero === numCasier);
        if (casier) {
            casier[champ] = valeur;
            sauvegarderBase();
            genererCasiers(); 
        }
    }

    function afficherBaseDonnees(filtre = "") {
        const tbody = document.getElementById('db-table-body');
        tbody.innerHTML = '';
        if (baseCasiers.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Aucune donnée. Générez la structure ou liez un fichier.</td></tr>`;
            return;
        }
        const texteRecherche = filtre.toLowerCase();

        baseCasiers.forEach(casier => {
            if (texteRecherche === "" || casier.numero.toString().includes(texteRecherche) || casier.eleve1.toLowerCase().includes(texteRecherche) || casier.eleve2.toLowerCase().includes(texteRecherche) || casier.classe.toLowerCase().includes(texteRecherche)) {
                let input1 = `<input type="text" class="input-eleve" value="${casier.eleve1}" onchange="updateEleve(${casier.numero}, 'eleve1', this.value)" placeholder="Saisir nom...">`;
                let input2 = casier.estSolo ? `<span style="color: gray;">X (Casier solo)</span>` : `<input type="text" class="input-eleve" value="${casier.eleve2}" onchange="updateEleve(${casier.numero}, 'eleve2', this.value)" placeholder="Saisir nom...">`;
                let tr = document.createElement('tr');
                tr.innerHTML = `<td style="text-align: center; font-weight: bold;">${casier.numero}</td><td><span style="${casier.estMarge ? 'color: #e67e22;' : ''}">${casier.classe} ${casier.estMarge ? '(Marge)' : ''}</span></td><td>${input1}</td><td>${input2}</td>`;
                tbody.appendChild(tr);
            }
        });
    }

    function filtrerBase() {
        afficherBaseDonnees(document.getElementById('search-input').value);
    }
</script>

</body>
</html>

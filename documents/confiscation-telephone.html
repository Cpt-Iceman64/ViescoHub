<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impression - Billets Confiscation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Styles pour l'interface de prévisualisation (Écran) */
        @media screen {
            body {
                background-color: #080c16;
                background-image: 
                    linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
                background-size: 50px 50px;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 2rem;
                min-height: 100vh;
                font-family: system-ui, -apple-system, sans-serif;
            }

            .a4-preview {
                background: white;
                /* Dimensions strictes A4 */
                width: 210mm;
                height: 297mm;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                margin-top: 1rem;
            }
        }

        /* Styles spécifiques et critiques pour l'Impression */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0; /* Aucune marge physique du navigateur */
            }
            body {
                margin: 0;
                padding: 0;
                background: white;
            }
            .no-print {
                display: none !important;
            }
            .a4-preview {
                width: 210mm;
                height: 297mm;
                box-shadow: none;
                margin: 0;
            }
        }

        /* Grille globale de la feuille A4 */
        .ticket-grid {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Lignes de coupe parfaites au centre */
        .ticket-grid::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            border-left: 1px dashed #cbd5e1;
            z-index: 10;
        }
        .ticket-grid::after {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 50%;
            border-top: 1px dashed #cbd5e1;
            z-index: 10;
        }

        /* Design individuel d'un billet */
        .ticket {
            width: 50%;
            height: 50%;
            box-sizing: border-box;
            padding: 12mm; /* Marge interne */
            display: flex;
            flex-direction: column;
            color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11pt;
        }

        /* En-tête */
        .header { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
        .logo { width: 45px; height: 60px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .school-info { line-height: 1.1; }
        .school-title { color: #111827; text-decoration: none; font-weight: 800; font-size: 11.5pt; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.02em; }
        .school-address { font-size: 9pt; }
        .school-city { font-weight: bold; font-style: italic; font-size: 9.5pt; margin-top: 2px; text-transform: uppercase; }

        /* Titre du document */
        .ticket-title {
            text-align: center;
            font-weight: bold;
            font-size: 12pt;
            border: 2px solid black;
            padding: 4px;
            margin-bottom: 15px;
            background-color: #f8fafc;
            -webkit-print-color-adjust: exact; /* Force l'impression du fond grisé si supporté */
            print-color-adjust: exact;
        }

        /* Lignes à remplir */
        .fill-line {
            display: flex;
            align-items: flex-end;
            margin-bottom: 12px;
            line-height: 1;
        }
        .fill-text {
            white-space: nowrap;
            margin-right: 4px;
            font-weight: bold;
            font-size: 10pt;
        }
        .dots {
            flex-grow: 1;
            border-bottom: 2px dotted #555;
            height: 10px;
            margin: 0 4px;
        }

        /* Encadré État du téléphone */
        .state-box {
            border: 1px solid black;
            padding: 8px;
            margin-top: 8px;
            margin-bottom: 15px;
        }
        .state-title {
            font-weight: bold;
            font-size: 10pt;
            margin-bottom: 8px;
            text-decoration: underline;
        }
        .state-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 9.5pt;
        }
        .state-item {
            display: flex;
            align-items: flex-end;
        }
        .print-checkbox {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 1px solid black;
            margin-right: 6px;
            flex-shrink: 0;
            position: relative;
            top: -2px;
        }

        /* Zone de signatures */
        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: auto; /* Pousse les signatures tout en bas du billet */
            gap: 10px;
        }
        .sig-box {
            width: 48%;
            height: 60px;
            border: 1px dotted #888;
            padding: 4px;
            font-size: 8.5pt;
            font-style: italic;
            display: flex;
            flex-direction: column;
        }
    
        select option { background-color: #1e293b; color: #ffffff; }
    </style>
</head>
<body>
    <header></header>


    <!-- Barre d'outils (Invisible à l'impression) -->
    <div class="no-print w-full max-w-4xl mx-auto flex justify-between items-center bg-slate-900/80 backdrop-blur-md border border-slate-700 p-4 rounded-2xl shadow-xl z-50 sticky top-4">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-pink-500/20 text-pink-500 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
            </div>
            <div>
                <h1 class="text-white font-bold text-lg leading-tight">Impression Billets de Confiscation</h1>
                <p class="text-slate-400 text-xs font-medium">A4 (210x297) • Coupe parfaite à 50%</p>
            </div>
        </div>
        <div class="flex gap-3">
            <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-lg transition-colors">
                Retour
            </a>
            <button onclick="window.print()" class="flex items-center gap-2 px-5 py-2 bg-pink-600 hover:bg-pink-500 text-white text-sm font-bold rounded-lg transition-all shadow-[0_0_15px_rgba(236,72,153,0.3)] hover:shadow-[0_0_25px_rgba(236,72,153,0.5)]">
                Imprimer
            </button>
        </div>
    </div>

    <!-- Feuille A4 -->
    <div class="a4-preview ticket-grid" id="ticket-template">
        <!-- Généré par JS -->
    </div>

    <script>
        const singleTicketHTML = `
            <div class="ticket">
                <!-- En-tête -->
                <div class="header">
                    <div class="logo">
                        <img src="../logo.png" alt="Logo Collège" />
                    </div>
                    <div class="school-info">
                        <div class="school-title">COLLEGE DES CORDELIERS</div>
                        <div class="school-address">Rue des Remparts, B.P. 122</div>
                        <div class="school-city">64404 OLORON SAINTE MARIE</div>
                    </div>
                </div>

                <div class="ticket-title">CONFISCATION DE TÉLÉPHONE</div>

                <!-- Lignes à remplir -->
                <div class="fill-line">
                    <span class="fill-text">Date :</span><span class="dots" style="flex-grow: 0.5;"></span>
                    <span class="fill-text">Heure :</span><span class="dots" style="flex-grow: 0.3;"></span>
                </div>

                <div class="fill-line">
                    <span class="fill-text">Nom de l'élève :</span><span class="dots"></span>
                </div>

                <div class="fill-line">
                    <span class="fill-text">Classe :</span><span class="dots" style="flex-grow: 0.2;"></span>
                    <span class="fill-text">Adulte référent :</span><span class="dots" style="flex-grow: 0.8;"></span>
                </div>

                <div class="fill-line">
                    <span class="fill-text">Motif :</span><span class="dots"></span>
                </div>

                <!-- État du téléphone -->
                <div class="state-box">
                    <div class="state-title">État du téléphone lors de la remise :</div>
                    <div class="state-grid">
                        <div class="state-item">
                            <span class="print-checkbox"></span><span>Bon état général</span>
                        </div>
                        <div class="state-item">
                            <span class="print-checkbox"></span><span>Écran rayé / fissuré</span>
                        </div>
                        <div class="state-item">
                            <span class="print-checkbox"></span><span>Coque abîmée</span>
                        </div>
                        <div class="state-item">
                            <span class="print-checkbox"></span><span>Écran cassé</span>
                        </div>
                    </div>
                    <div class="state-item" style="margin-top: 8px;">
                        <span class="print-checkbox"></span><span style="white-space:nowrap; margin-right:4px;">Autre :</span><span class="dots"></span>
                    </div>
                </div>

                <!-- Signatures -->
                <div class="signatures">
                    <div class="sig-box">
                        <span>Signature de l'élève :</span>
                    </div>
                    <div class="sig-box">
                        <span>Signature de l'adulte (AED/CPE) :</span>
                    </div>
                </div>
            </div>
        `;

        // Génération automatique des 4 billets sur la page
        document.getElementById('ticket-template').innerHTML = singleTicketHTML.repeat(4);
    </script>
    <script src="../js/menu.js"></script>
</body>
</html>

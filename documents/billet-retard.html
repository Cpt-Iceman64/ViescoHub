<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impression - Billets de Retard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Styles pour l'interface de prévisualisation (Écran) */
        @media screen {
            body {
                background-color: #080c16;
                background-image: 
                    linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
                background-size: 50px 50px;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 2rem;
                min-height: 100vh;
                font-family: system-ui, -apple-system, sans-serif;
            }

            .a4-preview {
                background: white;
                /* Dimensions strictes A4 */
                width: 210mm;
                height: 297mm;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                margin-top: 1rem;
            }
        }

        /* Styles spécifiques et critiques pour l'Impression */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0; /* Aucune marge physique du navigateur */
            }
            body {
                margin: 0;
                padding: 0;
                background: white;
            }
            .no-print {
                display: none !important;
            }
            .a4-preview {
                width: 210mm;
                height: 297mm;
                box-shadow: none;
                margin: 0;
            }
        }

        /* Grille globale de la feuille A4 */
        .ticket-grid {
            position: relative; /* Indispensable pour la croix de coupe absolue */
            display: flex;
            flex-wrap: wrap;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* --- LIGNES DE COUPE PARFAITES AU CENTRE --- */
        /* Ligne verticale au milieu (à exactement 105mm) */
        .ticket-grid::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            border-left: 1px dashed #cbd5e1;
            z-index: 10;
        }
        /* Ligne horizontale au milieu (à exactement 148.5mm) */
        .ticket-grid::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            border-top: 1px dashed #cbd5e1;
            z-index: 10;
        }

        /* Design individuel d'un billet - Strictement symétrique */
        .ticket {
            width: 50%;  /* 50% de 210mm = 105mm */
            height: 50%; /* 50% de 297mm = 148.5mm */
            box-sizing: border-box;
            padding: 15mm 12mm; /* Marge interne pour que le texte ne touche jamais la ligne de coupe */
            display: flex;
            flex-direction: column;
            color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11pt;
        }

        /* Composants internes du billet */
        .header { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 20px; }
        
        /* Conteneur du logo optimisé pour une vraie image */
        .logo { 
            width: 55px; 
            height: 75px; 
            flex-shrink: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Empêche la déformation de l'image */
        }
        
        .school-info { line-height: 1.2; }
        .school-title { 
            color: #111827; 
            text-decoration: none; 
            font-weight: 800; 
            font-size: 11.5pt; 
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .school-address { font-size: 10pt; }
        .school-city { font-weight: bold; font-style: italic; font-size: 10.5pt; margin-top: 2px; text-transform: uppercase; }

        /* Tableau */
        .motif-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 10pt;
        }
        .motif-table td {
            border: 1px solid black;
            padding: 5px 6px;
            vertical-align: middle;
        }
        .motif-table td.checkbox {
            width: 25px;
        }

        /* Lignes à remplir */
        .fill-line {
            display: flex;
            align-items: flex-end;
            margin-bottom: 16px;
            line-height: 1;
        }
        .fill-text {
            white-space: nowrap;
            margin-right: 4px;
        }
        .dots {
            flex-grow: 1;
            border-bottom: 2px dotted #333;
            height: 10px; /* Force la ligne à s'aligner avec le bas du texte */
            margin: 0 4px;
        }
        
        /* Ajustements spécifiques pour les lignes complexes */
        .signature-area {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <header></header>


    <!-- Barre d'outils (Invisible à l'impression) -->
    <div class="no-print w-full max-w-4xl mx-auto flex justify-between items-center bg-slate-900/80 backdrop-blur-md border border-slate-700 p-4 rounded-2xl shadow-xl z-50 sticky top-4">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-pink-500/20 text-pink-500 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            </div>
            <div>
                <h1 class="text-white font-bold text-lg leading-tight">Impression Billets de Retard</h1>
                <p class="text-slate-400 text-xs font-medium">A4 (210x297) • Coupe parfaite à 50%</p>
            </div>
        </div>
        <div class="flex gap-3">
            <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-lg transition-colors">
                Retour
            </a>
            <button onclick="window.print()" class="flex items-center gap-2 px-5 py-2 bg-pink-600 hover:bg-pink-500 text-white text-sm font-bold rounded-lg transition-all shadow-[0_0_15px_rgba(236,72,153,0.3)] hover:shadow-[0_0_25px_rgba(236,72,153,0.5)]">
                Imprimer
            </button>
        </div>
    </div>

    <!-- Feuille A4 -->
    <div class="a4-preview ticket-grid" id="ticket-template">
        <!-- Les billets seront injectés ici par le script -->
    </div>

    <script>
        // Contenu HTML d'un billet unique reproduisant fidèlement l'image fournie
        const singleTicketHTML = `
            <div class="ticket">
                <!-- En-tête -->
                <div class="header">
                    <!-- Intégration du vrai logo -->
                    <div class="logo">
                        <img src="../logo.png" alt="Logo Collège" />
                    </div>
                    
                    <div class="school-info">
                        <div class="school-title">COLLEGE DES CORDELIERS</div>
                        <div class="school-address">Rue des Remparts</div>
                        <div class="school-address">B.P. 122</div>
                        <div class="school-city">64404 OLORON SAINTE MARIE</div>
                    </div>
                </div>

                <!-- Tableau des services -->
                <table class="motif-table">
                    <tr>
                        <td>Direction</td>
                        <td class="checkbox"></td>
                        <td>Intendance</td>
                        <td class="checkbox"></td>
                    </tr>
                    <tr>
                        <td>Vie Scolaire</td>
                        <td class="checkbox"></td>
                        <td>C.O.P</td>
                        <td class="checkbox"></td>
                    </tr>
                    <tr>
                        <td>Assistance sociale</td>
                        <td class="checkbox"></td>
                        <td>Infirmière</td>
                        <td class="checkbox"></td>
                    </tr>
                    <tr>
                        <td>C.P.E</td>
                        <td class="checkbox"></td>
                        <td colspan="2" style="border-right: 1px solid black;">Autre:</td>
                    </tr>
                </table>

                <!-- Lignes à remplir -->
                <div class="fill-line">
                    <span class="fill-text">L'élève</span>
                    <span class="dots"></span>
                </div>

                <div class="fill-line">
                    <span class="fill-text">Classe de</span>
                    <span class="dots" style="flex-grow: 0.5;"></span>
                    <span class="fill-text">est autorisé(e) à rentrer en</span>
                </div>

                <div class="fill-line">
                    <span class="fill-text">cours de</span>
                    <span class="dots"></span>
                    <span class="fill-text">à</span>
                    <span class="dots" style="flex-grow: 0.2;"></span>
                    <span class="fill-text">h</span>
                    <span class="dots" style="flex-grow: 0.3;"></span>
                </div>

                <div class="fill-line">
                    <span class="fill-text">Le</span>
                    <span class="dots"></span>
                </div>

                <div class="signature-area">
                    <span class="fill-text">Signature:</span>
                </div>
            </div>
        `;

        // Génération automatique des 4 billets sur la page
        document.getElementById('ticket-template').innerHTML = singleTicketHTML.repeat(4);
    </script>
    <script src="../js/menu.js"></script>
</body>
</html>
